# Per-repo pytest configuration for stable test suite building.
# Each repo has base_args (appended after "pytest") and optional deselect/ignore lists.

repos:
  pandas-dev/pandas:
    pytest_cwd: /
    base_args: >-
      -qq --tb=long -p no:cacheprovider
      --continue-on-collection-errors
      -o addopts=
      -o console_output_style=progress
      -W ignore::DeprecationWarning
      -m "not slow and not network and not db and not single_cpu and not arm_slow and not clipboard and not high_memory"
      --pyargs pandas
    ignore:
      - .venv/lib/python3.10/site-packages/pandas/tests/plotting
      - .venv/lib/python3.10/site-packages/pandas/tests/io
      - .venv/lib/python3.10/site-packages/pandas/tests/window
      - .venv/lib/python3.10/site-packages/pandas/tests/computation/test_eval.py
      - .venv/lib/python3.10/site-packages/pandas/tests/groupby/test_raises.py
      - .venv/lib/python3.10/site-packages/pandas/tests/scalar/timestamp/test_formats.py
      - .venv/lib/python3.10/site-packages/pandas/tests/scalar/timestamp/test_rendering.py
      - .venv/lib/python3.10/site-packages/pandas/tests/tslibs/test_parsing.py
      - .venv/lib/python3.10/site-packages/pandas/tests/scalar/timedelta/test_timedelta.py

  numpy/numpy:
    pytest_cwd: /
    pytest_tooling_packages:
      - pytest
      - pytest-reportlog
      - pytest-testmon
      - pytest-timeout
      - pytest-xdist
      - pytest-randomly
      - cython
      - "setuptools<82"
      - hypothesis==6.141.1
    base_args: >-
      -qq --tb=long -p no:cacheprovider --continue-on-collection-errors
      -o addopts=
      -m "not slow and not slow_pypy and not leaks_references and not valgrind_error"
      -W ignore::hypothesis.errors.HypothesisDeprecationWarning
      --pyargs numpy
    ignore:
      - .venv/lib/python3.11/site-packages/numpy/typing/tests/test_typing.py
      - .venv/lib/python3.11/site-packages/numpy/distutils/tests
      - .venv/lib/python3.11/site-packages/numpy/tests/test_public_api.py
      - .venv/lib/python3.11/site-packages/numpy/core/tests/test_mem_policy.py
      - .venv/lib/python3.11/site-packages/numpy/_core/tests/test_mem_policy.py

  huggingface/datasets:
    base_args: >-
      -qq --tb=long -p no:cacheprovider --continue-on-collection-errors
  
  abetlen/llama-cpp-python:
    base_args: >-
      -qq --tb=long -p no:cacheprovider --continue-on-collection-errors
    profiler_variant: llama
    parser_variant: llama

  python-pillow/Pillow:
    base_args: >-
      -qq --tb=long -p no:cacheprovider --continue-on-collection-errors

  uploadcare/pillow-simd:
    base_args: >-
      -qq --tb=long -p no:cacheprovider --continue-on-collection-errors

  huggingface/tokenizers:
    pytest_cwd: /testbed/bindings/python
    base_args: >-
      -qq --tb=long -p no:cacheprovider --continue-on-collection-errors
      -m "not slow"
    ignore:
      - tests/test_serialization.py
    parser_variant: rust

  tornadoweb/tornado:
    pytest_cwd: /
    base_args: >-
      -qq --tb=long -p no:cacheprovider --continue-on-collection-errors
      --pyargs tornado

  huggingface/transformers:
    base_args: >-
      -qq --tb=no -p no:cacheprovider --continue-on-collection-errors
    ignore:
      - examples/research_projects/codeparrot/scripts/tests
    pytest_command: [python, -m, pytest]
    extra_test_installs:
      - [parameterized, "pyarrow<21", "setuptools<82"]

  pydantic/pydantic:
    base_args: >-
      -qq --tb=long -p no:cacheprovider --continue-on-collection-errors

# Per-instance overrides.
instance_overrides:
  patch_transformers_testing_utils:
    - huggingface__transformers-253f9a3
    - huggingface__transformers-211f93a
  # Replaces the old install_jsonschema / install_pytest_benchmark /
  # install_tzdata membership lists. Each inner list becomes one
  # `uv pip install ...` line, in order (jsonschema -> pytest-benchmark ->
  # tzdata, matching the old build_run_tests_install_commands order).
  extra_test_installs:
    pydantic__pydantic-addf1f9:
      - [jsonschema]
      - [pytest-benchmark]
    pydantic__pydantic-c2647ab:
      - [jsonschema]
      - [pytest-benchmark]
