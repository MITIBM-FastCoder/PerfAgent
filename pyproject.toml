[project]
name = "perfagent"
version = "0.1.0"
description = "Standalone harness for LLM-driven performance-optimization agents (GSO / SWE-fficiency)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=2.19",
    "docker>=7.0",
    "jinja2>=3.1",
    "litellm>=1.99",
    "mini-swe-agent>=2.4.6",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.scripts]
perfagent = "perfagent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/perfagent"]
